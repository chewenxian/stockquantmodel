# ============================================
# 股票情报系统配置
# ============================================

# 系统设置
system:
  data_dir: "data"
  db_path: "data/stock_news.db"
  log_dir: "logs"

# 自选股列表文件
stocks_file: "stocks.csv"

# 数据采集
collector:
  # 采集频率（分钟）
  intervals:
    quick: 10         # 快速采集（新闻+行情）
    news: 15          # 财经新闻
    market: 5         # 行情数据（每次全部自选股）
    money_flow: 15    # 资金流向
    policy: 30        # 政策新闻
    announcement: 60  # 公司公告
    sentiment: 60     # 社交媒体情绪
    sina_news: 30     # 新浪财经新闻（7个板块）
    industry_boards: 15  # 行业板块排行

  # 数据源开关
  sources:
    # ✅ 有效数据源
    sina: true            # 新浪财经（新闻+行情）— 主力数据源
    bb_browser: true       # bb-browser 浏览器采集（雪球112只行情+热股+东财新闻）
    cls: true             # 财联社（电报快讯）
    jin10: true           # 金十数据（快讯）
    gov_policy: false     # 政府网站URL已404失效，由财联社+华尔街见闻覆盖
    stcn: true            # 证券时报
    # ⚠️ 部分有效
    eastmoney: false      # 东方财富（推建首页news有时能采到，push2行情/资金已挂，false=跳过，避免重试耗时）
    xueqiu: false         # 雪球旧爬虫（页面解析不稳定，由 bb-browser 替代）
    10jqka: false         # 同花顺7x24快讯（API已变，一直0条）
    # ❌ 已失效，关闭
    cninfo: false         # 巨潮资讯（API需更新）
    wallstreet: false     # 华尔街见闻
    tencent: false        # 腾讯证券
    national_stat: false  # 国家统计局
    sse: false            # 上交所公告
    szse: false           # 深交所公告
    bse: false            # 北交所公告
    history_quotes: false # 历史K线（baostock未安装+腾讯API已变）
    north_flow: false     # 北向资金（push2不可达）
    margin_trading: false # 融资融券（push2不可达）
    guba_sentiment: false # 股吧情绪（push2ex已404，由bb-browser行情情绪替代）
    bond_yield: false     # 国债收益率（和讯/华尔街API已变）
    stock_hot: false      # 股票热度（push2ex已404，由bb-browser雪球热榜替代）

# 分析模块
analyzer:
  provider: "deepseek"    # deepseek / openai
  model: "deepseek-chat"
  api_base: "https://api.deepseek.com"
  # API key 从环境变量读取 DEEPSEEK_API_KEY
  schedule: "0 16 * * 1-5"  # 交易日16:00

# 推送
notify:
  wechat: true           # 通过 OpenClaw 微信推送
  schedule: "30 16 * * 1-5"  # 交易日16:30推送日报

# 代理（国内访问 GitHub 需要）
proxy:
  http: "http://127.0.0.1:7897"
  https: "http://127.0.0.1:7897"
